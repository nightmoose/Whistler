name: Whistler
options:
  bundleIdPrefix: com.nightmoose
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""  # set your Apple team id, or pass DEVELOPMENT_TEAM=<id> to xcodebuild
    CODE_SIGN_STYLE: Automatic
targets:
  Whistler:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Info.plist
          - Resources/Assets.xcassets
      - path: Sources/Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nightmoose.whistler
        PRODUCT_NAME: Whistler
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPAD: NO
        SUPPORTS_MACCATALYST: NO
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Whistler
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Whistler listens so it can transcribe the melody you whistle.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: MIDI File
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.midi-audio
            CFBundleTypeExtensions:
              - mid
              - midi
  WhistlerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Whistler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nightmoose.whistler.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Whistler.app/Whistler"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Whistler:
    build:
      targets:
        Whistler: all
        WhistlerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WhistlerTests
